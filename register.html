<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Eras Portal - Register</title>

    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js" integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
        body {
            background-image: url("taylor.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #b8cde0;
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px 15px;
        }

        .register-section {
            width: 90%;
            max-width: 450px;
            padding: 15px 20px;
            text-align: center;
        }

        .site-title {
            color: white;
            font-size: 34px;
            font-weight: bold;
            margin: 0 0 6px 0;
            text-shadow: 2px 2px 4px #263b4f;
        }

        .site-subtitle {
            color: white;
            font-size: 14px;
            margin: 0 0 15px 0;
            text-shadow: 1px 1px 3px #263b4f;
        }

        nav {
            margin-bottom: 20px;
        }

        nav a {
            display: inline-block;
            color: white;
            background-color: rgba(38, 59, 79, 0.75);
            border: 2px solid #d9a6a6;
            border-radius: 15px;
            padding: 7px 15px;
            margin: 0 5px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
        }

        nav a:hover {
            background-color: #d9a6a6;
            color: #263b4f;
        }

        .register-section h2 {
            color: white;
            font-size: 27px;
            margin: 0 0 7px 0;
            text-shadow: 2px 2px 4px #263b4f;
        }

        .register-description {
            color: white;
            font-size: 13px;
            margin: 0 0 17px 0;
            text-shadow: 1px 1px 3px #263b4f;
        }

        form {
            text-align: center;
        }

        label {
            display: block;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 5px;
            color: white;
            font-size: 13px;
            font-weight: bold;
            text-align: left;
            text-shadow: 1px 1px 3px #263b4f;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            display: block;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 11px;
            padding: 10px;
            border: 3px solid #d9a6a6;
            background-color: rgba(255, 248, 235, 0.94);
            color: #263b4f;
            font-size: 14px;
            text-align: center;
            border-radius: 15px;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border: 3px solid #6f8fa9;
            outline: none;
        }

        input::placeholder {
            color: #66788a;
        }

        label.error {
            color: #ffcccc;
            font-size: 11px;
            text-shadow: 1px 1px 2px #000;
            margin-top: -8px;
            margin-bottom: 8px;
            text-align: center;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
            display: block;
        }

        .success-box {
            background-color: rgba(92, 184, 92, 0.9);
            color: white;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }

        button[type="submit"] {
            display: block;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
            padding: 11px;
            background-color: #6f8fa9;
            color: white;
            border: 3px solid #d9a6a6;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 15px;
        }

        button[type="submit"]:hover {
            background-color: #d9a6a6;
            color: #263b4f;
        }

        .login-link {
            color: white;
            font-size: 13px;
            margin-top: 15px;
            text-shadow: 1px 1px 3px #263b4f;
        }

        .login-link a {
            color: #fff1d6;
            font-weight: bold;
            text-decoration: underline;
        }

        .login-link a:hover {
            color: #d9a6a6;
        }
    </style>
</head>

<body>

    <main>
        <section class="register-section">

            <h1 class="site-title">The Eras Portal</h1>
            <p class="site-subtitle">A little space for every era</p>

            <nav>
                <a href="index.html">Login</a>
                <a href="register.html">Register</a>
            </nav>

            <h2>Join The Eras</h2>
            <p class="register-description">Create your account and begin your journey through the eras.</p>

            <form id="registerForm" action="#" method="post">

                <div id="regSuccess" class="success-box">Registration successful! Redirecting to login...</div>

                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" placeholder="Enter your first name" maxlength="30">

                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" placeholder="Enter your last name" maxlength="30">

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" maxlength="50">

                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" maxlength="20">

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" maxlength="20">

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" maxlength="20">

                <button type="submit">Begin My Era</button>

                <p class="login-link">
                    Already have an account?
                    <a href="index.html">Login here</a>
                </p>

            </form>

        </section>
    </main>

    <script>
        $(document).ready(function(){
            $("#registerForm").validate({
                rules: {
                    firstName: { required: true, minlength: 2 },
                    lastName: { required: true, minlength: 2 },
                    email: { required: true, email: true },
                    username: { required: true, minlength: 3 },
                    password: { required: true, minlength: 5 },
                    confirmPassword: { required: true, equalTo: "#password" }
                },
                messages: {
                    firstName: { required: "Please enter your first name.", minlength: "First name must be at least 2 characters." },
                    lastName: { required: "Please enter your last name.", minlength: "Last name must be at least 2 characters." },
                    email: { required: "Please enter a valid email address.", email: "Please enter a valid email format." },
                    username: { required: "Please choose a username.", minlength: "Username must be at least 3 characters long." },
                    password: { required: "Please create a password.", minlength: "Password must be at least 5 characters long." },
                    confirmPassword: { required: "Please confirm your password.", equalTo: "Passwords do not match." }
                },
                submitHandler: function(form) {
                    localStorage.setItem("registeredEmail", $("#email").val());
                    localStorage.setItem("registeredPassword", $("#password").val());
                    localStorage.setItem("username", $("#firstName").val());

                    $("#regSuccess").slideDown();
                    setTimeout(function() {
                        window.location.href = "index.html";
                    }, 1500);
                }
            });
        });
    </script>

</body>
</html>
